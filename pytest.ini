[pytest]
testpaths = packages/data-pipeline/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = Lib Scripts data parquet_out .ocr_tmp __pycache__ .pytest_cache _archive .venv node_modules
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external services (Tesseract, PDFs)
