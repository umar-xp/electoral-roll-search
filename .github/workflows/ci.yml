name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r packages/data-pipeline/requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest packages/data-pipeline/tests/ -v --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm exec --yes npm@11.11.0 -- ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run vitest (unit tests + coverage)
        run: npx vitest run --coverage

      - name: Lint frontend
        run: npx eslint apps/web/*.js

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/manifest.json
          echo "Build manifest:"
          cat dist/manifest.json

      - name: Run legacy frontend tests
        run: node tests/test_frontend.js

      - name: Run integration tests
        run: node tests/test_integration.js

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # Ensure no API keys, passwords, or tokens are committed
          if grep -rn "password\|api_key\|secret\|token" --include="*.js" --include="*.py" --include="*.json" . \
            | grep -v node_modules \
            | grep -v ".git/" \
            | grep -v "package-lock" \
            | grep -v "test_" \
            | grep -v "# " \
            | grep -v "// "; then
            echo "WARNING: Potential secrets found in source code"
          fi

      - name: Verify CSP headers
        run: |
          if grep -q "unsafe-inline" _headers; then
            echo "ERROR: 'unsafe-inline' found in _headers CSP policy"
            exit 1
          fi

      - name: Verify no eval in JS
        run: |
          if grep -rn "\beval(" apps/web/*.js; then
            echo "ERROR: eval() found in frontend code"
            exit 1
          fi

  deploy:
    needs: [test-python, test-frontend, security-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build
        run: |
          npm exec --yes npm@11.11.0 -- ci
          npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '.'
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm exec --yes npm@11.11.0 -- ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  validate-data:
    name: Validate JSON Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate master_index.json schema
        run: |
          python3 -c "
          import json, sys
          with open('data/master_index.json') as f:
              data = json.load(f)
          assert 'districts' in data, 'Missing districts key'
          assert 'stats' in data, 'Missing stats key'
          assert data.get('schema_version'), 'Missing schema_version'
          print(f'✓ master_index.json valid: {len(data[\"districts\"])} districts, {data[\"stats\"].get(\"total_voters_live\", 0):,} voters')
          "

      - name: Validate all district JSON files
        run: |
          python3 -c "
          import json, os, sys
          errors = []
          count = 0
          for root, dirs, files in os.walk('data/districts'):
              for f in files:
                  if f.endswith('.json'):
                      path = os.path.join(root, f)
                      count += 1
                      try:
                          with open(path) as fh:
                              json.load(fh)
                      except json.JSONDecodeError as e:
                          errors.append(f'{path}: {e}')
          if errors:
              print(f'✗ {len(errors)} invalid JSON files out of {count}:')
              for e in errors[:20]:
                  print(f'  {e}')
              sys.exit(1)
          print(f'✓ All {count} JSON data files valid')
          "
